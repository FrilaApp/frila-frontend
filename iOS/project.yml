name: Frila
options:
  bundleIdPrefix: com.frila
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: pt-BR

configs:
  Debug-Local: debug
  Debug-Dev: debug
  Release-Beta: release
  Release-Prod: release

configFiles:
  Debug-Local: Configurations/Local.xcconfig
  Debug-Dev: Configurations/Dev.xcconfig
  Release-Beta: Configurations/Beta.xcconfig
  Release-Prod: Configurations/Prod.xcconfig

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B7F7G3Y2U
    # Versão e build numa fonte só, herdada pelo app e pela extensão de notificação: a App Store
    # recusa a extensão com versão diferente da do app. O enviar-testflight.sh sobrescreve as duas
    # pela linha de comando, para todos os alvos.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  # dSYM em todos os targets, e não só no app: o código roda nos quatro frameworks, e o
  # Crashlytics segura a falha fatal enquanto falta o dSYM de qualquer binário da pilha. Com
  # dSYM só no app, a falha forçada no catálogo (FrilaApresentacao) nunca apareceu no painel.
  configs:
    Debug-Dev:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release-Beta:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    Release-Prod:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  FrilaDominio:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Dominio
      # Manifesto de privacidade de cada framework que usa UserDefaults (#96): a Apple pede o
      # manifesto no bundle que contém a biblioteca dinâmica, não só no do app.
      - path: Resources/Frameworks/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).dominio
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaDados:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Dados
      - path: Resources/Fixtures
        buildPhase: resources
      - path: Resources/Frameworks/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).dados
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaApresentacao:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Apresentacao
      - path: Resources/DesignSystem.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Licencas.json
        buildPhase: resources
      - path: Resources/Frameworks/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).apresentacao
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaInfraestrutura:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Infraestrutura
      - path: Resources/Frameworks/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).infraestrutura
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  # Extensão de serviço de notificação (#253): troca o texto do push de outro vínculo antes de o
  # sistema mostrá-lo, com o app fechado. Só depende do domínio; o framework é o embutido no app
  # (`embed: false`), alcançado por `@executable_path/../../Frameworks`.
  #
  # O build assinado para aparelho exige, no portal da Apple, o App Group `group.com.frila.org.app`
  # no App ID principal e um App ID novo para `com.frila.org.app.notificationservice` com o mesmo
  # grupo; simulador e CI sem assinatura não dependem disso.
  FrilaNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
      - path: Resources/Frameworks/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).notificationservice
        PRODUCT_NAME: FrilaNotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frila
        INFOPLIST_FILE: Sources/NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/NotificationService/NotificationService.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        SKIP_INSTALL: YES

  Frila:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Resources/App.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
      - target: FrilaDados
      - target: FrilaApresentacao
      - target: FrilaInfraestrutura
      - target: FrilaNotificationService
    preBuildScripts:
      - name: Validate Supabase configuration
        path: Scripts/validate-supabase-config.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postBuildScripts:
      - name: Select Firebase configuration
        path: Scripts/copy-firebase-config.sh
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/Resources/Firebase/Dev/GoogleService-Info.plist
          - $(SRCROOT)/Resources/Firebase/Prod/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
      # A fase precisa ficar por último: envia os dSYMs do build já configurado. Local e builds
      # sem segredo não têm plist e encerram esta fase sem falhar.
      #
      # Não usa o `Crashlytics/run`: ele manda só o dSYM do app (DWARF_DSYM_FILE_NAME) e roda o
      # envio em segundo plano com a saída descartada, então o dSYM dos frameworks nunca subia e
      # nada avisava. Aqui o `upload-symbols` recebe o dSYM do app e o de cada framework, e a
      # saída fica em crashlytics-upload-symbols.log. No archive o envio é síncrono e a falha
      # aparece no build; nos outros builds roda em segundo plano; na CI não roda.
      - name: Upload dos símbolos do Crashlytics
        script: |
          PLIST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [[ ! -f "$PLIST" ]]; then
            echo "warning: Crashlytics sem GoogleService-Info.plist; símbolos não enviados neste build" >&2
            exit 0
          fi

          if [[ "${DEBUG_INFORMATION_FORMAT:-}" != "dwarf-with-dsym" ]]; then
            echo "warning: Crashlytics sem dSYM nesta configuração; símbolos não enviados neste build" >&2
            exit 0
          fi

          ENVIAR="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          LOG="${DERIVED_FILE_DIR}/crashlytics-upload-symbols.log"
          DSYMS=("${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}")
          for FRAMEWORK in FrilaDominio FrilaDados FrilaApresentacao FrilaInfraestrutura; do
            DSYMS+=("${DWARF_DSYM_FOLDER_PATH}/${FRAMEWORK}.framework.dSYM")
          done
          for DSYM in "${DSYMS[@]}"; do
            if [[ ! -d "$DSYM" ]]; then
              echo "warning: dSYM ausente, a falha nesse binário fica retida no Crashlytics: ${DSYM##*/}" >&2
            fi
          done

          # Build de simulador da CI nunca é distribuído, e o upload-symbols já caiu com
          # Segmentation fault no runner do GitHub (30/09), derrubando o build do main.
          if [[ -n "${CI:-}" ]]; then
            echo "Build de CI: símbolos do Crashlytics não enviados"
            exit 0
          fi

          # Archive (ACTION=install) é o que vai para o TestFlight: envio síncrono, com uma
          # segunda tentativa, e o archive falha se os símbolos não subirem. Nos outros builds o
          # envio roda em segundo plano para não atrasar cada compilação.
          if [[ "${ACTION:-}" == "install" ]]; then
            if ! "$ENVIAR" -gsp "$PLIST" -p ios "${DSYMS[@]}" > "$LOG" 2>&1                && ! "$ENVIAR" -gsp "$PLIST" -p ios "${DSYMS[@]}" >> "$LOG" 2>&1; then
              echo "error: envio dos símbolos do Crashlytics falhou duas vezes; veja $LOG" >&2
              exit 1
            fi
            echo "Símbolos do Crashlytics enviados: $(grep -c 'Successfully submitted' "$LOG") dSYMs"
          else
            "$ENVIAR" -gsp "$PLIST" -p ios "${DSYMS[@]}" > "$LOG" 2>&1 &
            echo "Envio dos símbolos do Crashlytics em segundo plano; resultado em $LOG"
          fi
        showEnvVars: false
        inputFiles:
          # O sandbox de scripts do Xcode só deixa ler o que está declarado: o binário do pacote
          # resolvido, o plist e cada dSYM (pasta, DWARF e Info.plist).
          - $(BUILD_DIR)/../../SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDominio.framework.dSYM
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDominio.framework.dSYM/Contents/Resources/DWARF/FrilaDominio
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDominio.framework.dSYM/Contents/Info.plist
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDados.framework.dSYM
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDados.framework.dSYM/Contents/Resources/DWARF/FrilaDados
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaDados.framework.dSYM/Contents/Info.plist
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaApresentacao.framework.dSYM
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaApresentacao.framework.dSYM/Contents/Resources/DWARF/FrilaApresentacao
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaApresentacao.framework.dSYM/Contents/Info.plist
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaInfraestrutura.framework.dSYM
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaInfraestrutura.framework.dSYM/Contents/Resources/DWARF/FrilaInfraestrutura
          - $(DWARF_DSYM_FOLDER_PATH)/FrilaInfraestrutura.framework.dSYM/Contents/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/crashlytics-upload-symbols.log
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID)
        PRODUCT_NAME: Frila
        # O preset de target do XcodeGen usa "1,2" e anula o valor do projeto; sem isto o app
        # declara iPad no UIDeviceFamily e o Xcode passa a exigir as quatro orientações.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frila
        INFOPLIST_KEY_CFBundleDevelopmentRegion: pt-BR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # INFOPLIST_KEY_* só aceita chaves da Apple; as chaves FRILA_* vêm deste plist parcial,
        # que o Xcode mescla ao Info.plist gerado.
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/App/Frila.entitlements
        OTHER_LDFLAGS: $(inherited) -ObjC

  FrilaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unitarios
    dependencies:
      - target: Frila
      - target: FrilaDominio
      - target: FrilaDados
      - target: FrilaApresentacao
      - target: FrilaInfraestrutura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  FrilaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Frila
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: AjudanteDeLancamentoUITests
        TEST_TARGET_NAME: Frila

schemes:
  Frila-Local:
    build:
      targets:
        Frila: all
        FrilaTests: [test]
        FrilaUITests: [test]
    run:
      config: Debug-Local
      commandLineArguments:
        -FRILA_SCENARIO: true
        success: true
    test:
      config: Debug-Local
      targets:
        - FrilaTests
        - FrilaUITests
    profile:
      config: Release-Prod
    archive:
      config: Debug-Local
  Frila-Dev:
    build:
      targets:
        Frila: all
        FrilaTests: [test]
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - FrilaTests
    profile:
      config: Release-Prod
    archive:
      config: Debug-Dev
  Frila-Beta:
    build:
      targets:
        Frila: all
    run:
      config: Release-Beta
    profile:
      config: Release-Beta
    archive:
      config: Release-Beta
  Frila-Prod:
    build:
      targets:
        Frila: all
    run:
      config: Release-Prod
    profile:
      config: Release-Prod
    archive:
      config: Release-Prod
