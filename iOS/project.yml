name: Frila
options:
  bundleIdPrefix: com.frila
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: pt-BR

configs:
  Debug-Local: debug
  Debug-Dev: debug
  Release-Beta: release
  Release-Prod: release

configFiles:
  Debug-Local: Configurations/Local.xcconfig
  Debug-Dev: Configurations/Dev.xcconfig
  Release-Beta: Configurations/Beta.xcconfig
  Release-Prod: Configurations/Prod.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B7F7G3Y2U

targets:
  FrilaDominio:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Dominio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).dominio
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaDados:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Dados
      - path: Resources/Fixtures
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).dados
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaApresentacao:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Apresentacao
      - path: Resources/DesignSystem.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).apresentacao
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  FrilaInfraestrutura:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Infraestrutura
    dependencies:
      - target: FrilaDominio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).infraestrutura
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  Frila:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Resources/App.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - target: FrilaDominio
      - target: FrilaDados
      - target: FrilaApresentacao
      - target: FrilaInfraestrutura
    preBuildScripts:
      - name: Validate Supabase configuration
        path: Scripts/validate-supabase-config.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postBuildScripts:
      - name: Select Firebase configuration
        path: Scripts/copy-firebase-config.sh
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/Resources/Firebase/Dev/GoogleService-Info.plist
          - $(SRCROOT)/Resources/Firebase/Prod/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID)
        PRODUCT_NAME: Frila
        # O preset de target do XcodeGen usa "1,2" e anula o valor do projeto; sem isto o app
        # declara iPad no UIDeviceFamily e o Xcode passa a exigir as quatro orientações.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frila
        INFOPLIST_KEY_CFBundleDevelopmentRegion: pt-BR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # INFOPLIST_KEY_* só aceita chaves da Apple; as chaves FRILA_* vêm deste plist parcial,
        # que o Xcode mescla ao Info.plist gerado.
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/App/Frila.entitlements

  FrilaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unitarios
    dependencies:
      - target: Frila
      - target: FrilaDominio
      - target: FrilaDados
      - target: FrilaApresentacao
      - target: FrilaInfraestrutura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  FrilaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Frila
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRILA_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Frila

schemes:
  Frila-Local:
    build:
      targets:
        Frila: all
        FrilaTests: [test]
        FrilaUITests: [test]
    run:
      config: Debug-Local
      commandLineArguments:
        -FRILA_SCENARIO: true
        success: true
    test:
      config: Debug-Local
      targets:
        - FrilaTests
        - FrilaUITests
    profile:
      config: Release-Prod
    archive:
      config: Debug-Local
  Frila-Dev:
    build:
      targets:
        Frila: all
        FrilaTests: [test]
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - FrilaTests
    profile:
      config: Release-Prod
    archive:
      config: Debug-Dev
  Frila-Beta:
    build:
      targets:
        Frila: all
    run:
      config: Release-Beta
    profile:
      config: Release-Beta
    archive:
      config: Release-Beta
  Frila-Prod:
    build:
      targets:
        Frila: all
    run:
      config: Release-Prod
    profile:
      config: Release-Prod
    archive:
      config: Release-Prod
