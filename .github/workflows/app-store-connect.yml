name: App Store Connect

# Metadados pela API, independente do envio do build. Só o disparo manual executa.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Consultar grupos, revisão beta, classificação ou URL de privacidade"
        type: choice
        options: [conferir, grupo-interno, classificacao, grupo-externo, revisao-beta, privacidade]
        default: conferir
        required: true
      aplicar:
        description: "Aplicar mudanças (desmarcado: apenas consulta e plano)"
        type: boolean
        default: false
      testadores:
        description: "E-mails da equipe, separados por vírgula; somente para grupo-interno"
        type: string
        required: false
      grupo:
        description: "Nome exato do grupo interno (reutiliza se já existir)"
        type: string
        default: Equipe Frila
      versao:
        description: "Versão iOS do build processado (grupo-externo e revisao-beta); confirmar origem Frila-Beta"
        type: string
        default: "0.5.1"
      limite_testadores:
        description: "Limite do link público de Testadores Frila (1 a 10000)"
        type: string
        default: "1000"
      verificacao_idade:
        description: "A versão inclui Declared Age Range do PR 95 (Age Assurance = Sim)"
        type: boolean
        default: true
      sem_referencias_alcool:
        description: "Confirmei pessoalmente ausência de referências a álcool, tabaco e drogas"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-store-connect-metadados
  cancel-in-progress: false

jobs:
  metadados:
    name: Grupos, revisão beta e classificação pela API
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: iOS
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mandar um build ao grupo externo ou à revisão beta é falar com a Apple: só com a última noturna
      # do iOS (suíte inteira, na main) verde. Consultas e o grupo interno não pedem isso.
      - name: Exigir a última noturna do iOS verde
        if: ${{ inputs.aplicar && (inputs.acao == 'grupo-externo' || inputs.acao == 'revisao-beta') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ULTIMA="$(gh run list --workflow ios-noturna.yml --branch main --status completed --limit 1 --json conclusion,databaseId,headSha --jq '.[0] | "\(.conclusion) \(.databaseId) \(.headSha)"')"
          echo "Última noturna concluída: ${ULTIMA:-nenhuma}"
          read -r CONCLUSAO ID SHA <<< "$ULTIMA"
          if [[ "$CONCLUSAO" != "success" ]]; then
            echo "::error::A última noturna do iOS não está verde (${CONCLUSAO:-nenhuma execução}). Corrija ou rode a noturna de novo (Actions > iOS noturna > Run workflow) antes de aplicar ${{ inputs.acao }}."
            exit 1
          fi
          echo "Noturna verde: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ID} (commit ${SHA:0:7})"

      - name: Conferir os três segredos antes de qualquer chamada
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_VALIDAR_SEGREDOS: "true"
        run: ruby Scripts/app-store-connect.rb

      - name: Testar o script sem rede e sem chave
        run: ruby Scripts/teste-app-store-connect.rb

      - name: Consultar ou aplicar metadados
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BETA_CONTATO_NOME: ${{ secrets.BETA_CONTATO_NOME }}
          BETA_CONTATO_TELEFONE: ${{ secrets.BETA_CONTATO_TELEFONE }}
          BETA_CONTATO_EMAIL: ${{ secrets.BETA_CONTATO_EMAIL }}
          BETA_DEMO_USUARIO: ${{ secrets.BETA_DEMO_USUARIO }}
          BETA_DEMO_SENHA: ${{ secrets.BETA_DEMO_SENHA }}
          # Entradas são lidas do GITHUB_EVENT_PATH pelo script, sem env que
          # o runner imprimiria antes de mascarar os e-mails.
        run: ruby Scripts/app-store-connect.rb
