name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "iOS/Contrato/openapi.yaml"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - "iOS/Contrato/openapi.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes-e-build:
    name: "Compilação e testes unitários do Android"
    runs-on: ubuntu-latest
    # O job foi a ~14 min com o passo novo de release e o cache do Robolectric frio: 15 min não dá folga.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (compileSdk 35 / build-tools 35.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Configurar Gradle e cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validar gradlew
        run: test -x ./gradlew

      - name: Conferir conformidade de contrato dos DTOs Android contra o OpenAPI
        run: |
          scripts/teste-contrato-android-confere.sh
          python3 scripts/conferir-contrato-android.py

      - name: Restaurar cache do Robolectric (android-all)
        id: cache-robolectric
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-4.15.1-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-4.15.1-

      - name: Baixar jars do Robolectric se faltarem no cache
        if: steps.cache-robolectric.outputs.cache-hit != 'true'
        run: |
          VERSOES=(
            "9-robolectric-4913185-2-i7"
            "10-robolectric-5803371-i7"
            "11-robolectric-6757853-i7"
            "12-robolectric-7732740-i7"
            "12.1-robolectric-8229987-i7"
            "13-robolectric-9030017-i7"
            "14-robolectric-10818077-i7"
            "15-robolectric-12650502-i7"
          )
          BASE_URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented"
          M2_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented"

          for v in "${VERSOES[@]}"; do
            DEST_DIR="$M2_DIR/$v"
            mkdir -p "$DEST_DIR"
            if [ ! -f "$DEST_DIR/android-all-instrumented-$v.jar" ]; then
              echo "Baixando android-all-instrumented-$v.jar..."
              curl -sSfL --retry 5 --retry-all-errors \
                "$BASE_URL/$v/android-all-instrumented-$v.jar" \
                -o "$DEST_DIR/android-all-instrumented-$v.jar"
            fi
            if [ ! -f "$DEST_DIR/android-all-instrumented-$v.pom" ]; then
              curl -sSfL --retry 5 --retry-all-errors \
                "$BASE_URL/$v/android-all-instrumented-$v.pom" \
                -o "$DEST_DIR/android-all-instrumented-$v.pom"
            fi
          done

      # Supabase (pedido 16-26): o par DEV vai para o BuildConfig do debug e o par PROD para o do release
      # (app/build.gradle.kts). Cada passo recebe só o par que usa; o Gradle nunca imprime os valores.
      - name: Executar testes unitários
        env:
          FRILA_SUPABASE_DEV_URL: ${{ secrets.FRILA_SUPABASE_DEV_URL }}
          FRILA_SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest

      # Testes do módulo :app com BuildConfig.DEBUG = false (o do #909 quebrava só no release e ninguém viu). O release exige
      # um par PROD do Supabase (trava em app/build.gradle.kts), então usamos um par SINTÉTICO fixo: host fictício (RFC 2606)
      # e uma chave de mentira que passa na trava. Nunca os segredos do Prod: este passo não depende de segredo e roda
      # também em PR de fork e do Dependabot. Outros módulos no release ficam de fora.
      - name: Executar testes unitários do app (release)
        env:
          FRILA_SUPABASE_PROD_URL: https://sintetico.supabase.invalid
          FRILA_SUPABASE_PROD_PUBLISHABLE_KEY: sb_publishable_sintetica_so_para_teste_de_ci
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Salvar cache do Robolectric (android-all)
        if: always() && steps.cache-robolectric.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-4.15.1-${{ hashFiles('android/gradle/libs.versions.toml') }}

      # Só PR de fork ou do Dependabot chega sem os segredos: ali o AAB de release é pulado com uma linha no log, e o APK
      # debug e os testes seguem. Em qualquer outro evento (push na main, tag, PR do próprio repositório, disparo manual)
      # faltar o par PROD é erro de configuração: a CI falha aqui, com uma linha clara. Com o par, o release roda e a trava
      # do app/build.gradle.kts (release sem o par PROD ou com chave proibida falha) vale como sempre.
      - name: Conferir se os segredos do Supabase chegaram
        id: segredos
        env:
          FRILA_SUPABASE_PROD_URL: ${{ secrets.FRILA_SUPABASE_PROD_URL }}
          EVENTO: ${{ github.event_name }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ATOR: ${{ github.actor }}
        run: |
          if [ -n "$FRILA_SUPABASE_PROD_URL" ]; then
            echo "tem_prod=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" = "pull_request" ] && { [ "$PR_DE_FORK" = "true" ] || [ "$ATOR" = "dependabot[bot]" ]; }; then
            echo "tem_prod=false" >> "$GITHUB_OUTPUT"
            echo "PR de fork ou do Dependabot, sem os segredos do Supabase: AAB de release pulado; APK debug e testes seguem."
          else
            echo "::error::Faltam os segredos do Supabase PROD neste evento ($EVENTO): configure FRILA_SUPABASE_PROD_URL e FRILA_SUPABASE_PROD_PUBLISHABLE_KEY."
            exit 1
          fi

      - name: Gerar APK (debug)
        env:
          FRILA_SUPABASE_DEV_URL: ${{ secrets.FRILA_SUPABASE_DEV_URL }}
          FRILA_SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Gerar AAB (release)
        if: steps.segredos.outputs.tem_prod == 'true'
        env:
          FRILA_RELEASE_KEYSTORE_BASE64: ${{ secrets.FRILA_RELEASE_KEYSTORE_BASE64 }}
          FRILA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FRILA_RELEASE_KEYSTORE_PASSWORD }}
          FRILA_RELEASE_KEY_ALIAS: ${{ secrets.FRILA_RELEASE_KEY_ALIAS }}
          FRILA_RELEASE_KEY_PASSWORD: ${{ secrets.FRILA_RELEASE_KEY_PASSWORD }}
          FRILA_SUPABASE_PROD_URL: ${{ secrets.FRILA_SUPABASE_PROD_URL }}
          FRILA_SUPABASE_PROD_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_PROD_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$FRILA_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Keystore de release configurado via segredos. Decodificando..."
            echo "$FRILA_RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            trap "rm -f /tmp/release.keystore" EXIT
            export FRILA_RELEASE_KEYSTORE_PATH="/tmp/release.keystore"
          else
            echo "Segredos de release ausentes (pendente de configuração por pessoa). Gerando artefato sem assinar."
          fi
          ./gradlew --no-daemon bundleRelease
          if [ -f "/tmp/release.keystore" ]; then
            rm -f /tmp/release.keystore
          fi

      - name: Publicar APK de debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frila-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # A cota de armazenamento de artefatos da organização estourou em 08/11/2026: 2 dias bastam para baixar e testar.
          retention-days: 2

      # O repositório é público e o artefato fica baixável por quem estiver logado: o AAB (par PROD) só é publicado em
      # tag v*. Nos outros eventos com segredo o AAB é gerado (prova a trava do par PROD), mas não sai da CI.
      - name: Publicar AAB de release
        if: steps.segredos.outputs.tem_prod == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frila-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 2

  ui-tests-instrumentados:
    name: "Testes instrumentados do Android (Emulador)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.repository == 'FrilaApp/frila-frontend' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle e cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Habilitar KVM no runner Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executar testes de interface com emulador Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FRILA_SUPABASE_PROD_URL: https://sintetico.supabase.invalid
          FRILA_SUPABASE_PROD_PUBLISHABLE_KEY: sb_publishable_sintetica_so_para_teste_de_ci
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

