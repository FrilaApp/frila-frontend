name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "iOS/Contrato/openapi.yaml"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - "iOS/Contrato/openapi.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes-e-build:
    name: "Compilação e testes unitários do Android"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (compileSdk 35 / build-tools 35.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Configurar Gradle e cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validar gradlew
        run: test -x ./gradlew

      - name: Conferir conformidade de contrato dos DTOs Android contra o OpenAPI
        run: |
          scripts/teste-contrato-android-confere.sh
          python3 scripts/conferir-contrato-android.py

      # Supabase (pedido 16-26): o par DEV vai para o BuildConfig do debug e o par PROD para o do release
      # (app/build.gradle.kts). Cada passo recebe só o par que usa; o Gradle nunca imprime os valores.
      - name: Executar testes unitários
        env:
          FRILA_SUPABASE_DEV_URL: ${{ secrets.FRILA_SUPABASE_DEV_URL }}
          FRILA_SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest

      # Em PR sem segredo (fork, Dependabot) o par PROD não chega: o AAB de release é pulado com uma linha no log, e o
      # APK debug e os testes seguem. Onde há segredo (push na main, PR do próprio repositório) o release roda, e a trava
      # do app/build.gradle.kts (release sem o par PROD falha) vale como sempre: só a CI escolhe se roda.
      - name: Conferir se os segredos do Supabase chegaram
        id: segredos
        env:
          FRILA_SUPABASE_PROD_URL: ${{ secrets.FRILA_SUPABASE_PROD_URL }}
        run: |
          if [ -n "$FRILA_SUPABASE_PROD_URL" ]; then
            echo "tem_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_prod=false" >> "$GITHUB_OUTPUT"
            echo "Sem os segredos do Supabase neste evento (PR de fork ou do Dependabot): AAB de release pulado; APK debug e testes seguem."
          fi

      - name: Gerar APK (debug)
        env:
          FRILA_SUPABASE_DEV_URL: ${{ secrets.FRILA_SUPABASE_DEV_URL }}
          FRILA_SUPABASE_DEV_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Gerar AAB (release)
        if: steps.segredos.outputs.tem_prod == 'true'
        env:
          FRILA_RELEASE_KEYSTORE_BASE64: ${{ secrets.FRILA_RELEASE_KEYSTORE_BASE64 }}
          FRILA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FRILA_RELEASE_KEYSTORE_PASSWORD }}
          FRILA_RELEASE_KEY_ALIAS: ${{ secrets.FRILA_RELEASE_KEY_ALIAS }}
          FRILA_RELEASE_KEY_PASSWORD: ${{ secrets.FRILA_RELEASE_KEY_PASSWORD }}
          FRILA_SUPABASE_PROD_URL: ${{ secrets.FRILA_SUPABASE_PROD_URL }}
          FRILA_SUPABASE_PROD_PUBLISHABLE_KEY: ${{ secrets.FRILA_SUPABASE_PROD_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$FRILA_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Keystore de release configurado via segredos. Decodificando..."
            echo "$FRILA_RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            trap "rm -f /tmp/release.keystore" EXIT
            export FRILA_RELEASE_KEYSTORE_PATH="/tmp/release.keystore"
          else
            echo "Segredos de release ausentes (pendente de configuração por pessoa). Gerando artefato sem assinar."
          fi
          ./gradlew --no-daemon bundleRelease
          if [ -f "/tmp/release.keystore" ]; then
            rm -f /tmp/release.keystore
          fi

      - name: Publicar APK de debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frila-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # A cota de armazenamento de artefatos da organização estourou em 08/11/2026: 2 dias bastam para baixar e testar.
          retention-days: 2

      - name: Publicar AAB de release
        if: steps.segredos.outputs.tem_prod == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frila-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 2
