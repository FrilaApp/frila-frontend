name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes-unitarios:
    name: "core:dominio, core:rede, core:seguranca, core:designsystem, feature:entrada e feature:vagas — testes unitários"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (compileSdk 35 / build-tools 35.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Validar gradlew
        run: test -x ./gradlew

      - name: ":core:dominio:test :core:rede:test :core:seguranca:test :core:designsystem:testDebugUnitTest :feature:entrada:testDebugUnitTest :feature:vagas:testDebugUnitTest"
        run: ./gradlew :core:dominio:test :core:rede:test :core:seguranca:test :core:designsystem:testDebugUnitTest :feature:entrada:testDebugUnitTest :feature:vagas:testDebugUnitTest --no-daemon
