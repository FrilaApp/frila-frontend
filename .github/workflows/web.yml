name: Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: "Lint, tipos, testes e build do web/"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run tipos

      - name: Testes (Vitest)
        run: npm test

      # A conferência contra o backend exige o segredo FRILA_BACKEND_TOKEN (leitura em
      # FrilaApp/frila-backend, privado). Sem ele, só a parte local roda, com aviso na PR.
      - name: Gate de deriva do contrato
        env:
          FRILA_BACKEND_TOKEN: ${{ secrets.FRILA_BACKEND_TOKEN }}
        run: |
          if [[ -n "$FRILA_BACKEND_TOKEN" ]]; then
            scripts/contrato-confere.sh
          else
            echo "::warning title=Contrato não conferido contra o backend::FRILA_BACKEND_TOKEN ausente: só integridade e tipos foram conferidos."
            scripts/contrato-confere.sh --local
          fi

      - name: Build sem aviso
        run: scripts/build-sem-aviso.sh

  e2e:
    name: "Playwright (Chromium, Firefox, WebKit)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
