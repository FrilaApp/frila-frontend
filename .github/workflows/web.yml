name: Web

on:
  pull_request:
    paths:
      - "Web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "Web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conferir:
    name: "Contrato, lint, tipos, testes, build, orçamento e fumaça da web"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Instalar dependências (versões exatas do lockfile)
        run: npm ci

      # O que vai para produção segue no nível moderado. As ferramentas de desenvolvimento (vite, @react-router/dev,
      # vitest, eslint) ficam no nível crítico enquanto o GHSA-fc5q-39xc-vjpf (picomatch, sem versão corrigida em
      # 17/11/2026) não tiver conserto. Voltar ao audit completo moderado quando houver: issue #937.
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar ferramentas de desenvolvimento
        run: npm audit --audit-level=critical

      - name: Contrato (espelho íntegro)
        run: npm run contrato

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run teste

      - name: Build
        run: npm run build

      - name: Orçamento do pacote
        run: npm run orcamento

      - name: Fumaça (rotas e cabeçalhos de segurança no runtime local)
        run: npm run fumaca
