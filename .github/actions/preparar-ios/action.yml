name: Preparar o ambiente iOS
description: >
  Passos que todo job macOS do iOS repete (ios.yml, ios-suite-completa.yml): Xcode fixado, XcodeGen fixado,
  projeto gerado, pacotes SPM em cache, configuração do Firebase e um simulador de iPhone já ligando.
  O checkout fica no job (esta ação mora no repositório).

inputs:
  firebase-dev-b64:
    description: Segredo FRILA_FIREBASE_GOOGLE_SERVICE_INFO_DEV_B64
    required: false
    default: ""
  firebase-prod-b64:
    description: Segredo FRILA_FIREBASE_GOOGLE_SERVICE_INFO_PROD_B64
    required: false
    default: ""

outputs:
  udid:
    description: UDID do simulador de iPhone escolhido (já em boot)
    value: ${{ steps.simulador.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Selecionar o Xcode 26.6 fixado
      shell: bash
      env:
        XCODE_VERSION: "26.6"
      run: |
        XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
        if [[ ! -d "$XCODE" ]]; then
          echo "::error::Xcode ${XCODE_VERSION} não está disponível neste runner"
          exit 1
        fi
        sudo xcode-select --switch "$XCODE/Contents/Developer"
        SAIDA="$(xcodebuild -version)"
        printf '%s\n' "$SAIDA"
        VERSION="${SAIDA%%$'\n'*}"
        if [[ "$VERSION" != "Xcode ${XCODE_VERSION}" ]]; then
          echo "::error::Versão de Xcode inesperada: $VERSION"
          exit 1
        fi
        echo "XCODE_VERSION=${XCODE_VERSION}" >> "$GITHUB_ENV"

    - name: Instalar o XcodeGen fixado
      shell: bash
      env:
        XCODEGEN_VERSION: "2.45.3"
        XCODEGEN_SHA256: "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878"
      run: |
        curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
        echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check --status
        unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Gerar o projeto
      shell: bash
      working-directory: iOS
      run: Scripts/gerar-projeto.sh

    - name: Definir DerivedData temporário
      shell: bash
      run: echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

    - name: Restaurar os pacotes SPM
      id: spm-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/DerivedData/SourcePackages
        key: ${{ runner.os }}-xcode-26.6-spm-${{ hashFiles('iOS/Package.resolved') }}

    - name: Resolver os pacotes SPM sem cache
      if: steps.spm-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: iOS
      run: |
        xcodebuild -resolvePackageDependencies \
          -project Frila.xcodeproj \
          -scheme Frila-Local \
          -clonedSourcePackagesDirPath "$DERIVED_DATA_PATH/SourcePackages" \
          -onlyUsePackageVersionsFromResolvedFile \
          | xcbeautify --renderer github-actions

    - name: Injetar a configuração do Firebase
      shell: bash
      working-directory: iOS
      env:
        FRILA_FIREBASE_GOOGLE_SERVICE_INFO_DEV_B64: ${{ inputs.firebase-dev-b64 }}
        FRILA_FIREBASE_GOOGLE_SERVICE_INFO_PROD_B64: ${{ inputs.firebase-prod-b64 }}
      run: Scripts/inject-firebase-config.sh all

    # O simulador liga enquanto o Xcode compila: `simctl boot` volta na hora e o boot segue sozinho.
    # Quem vai testar espera o fim do boot com `xcrun simctl bootstatus "$UDID"`.
    - name: Escolher e ligar um simulador de iPhone
      id: simulador
      shell: bash
      run: |
        UDID="$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        best = None
        for runtime, devices in json.load(sys.stdin)["devices"].items():
            if ".iOS-" not in runtime:
                continue
            version = tuple(int(p) for p in runtime.rsplit(".iOS-", 1)[1].split("-"))
            for device in devices:
                if device.get("isAvailable") and device["name"].startswith("iPhone"):
                    if best is None or version > best[0]:
                        best = (version, device["udid"], device["name"])
        if best:
            print(best[2] + ", iOS " + ".".join(map(str, best[0])), file=sys.stderr)
            print(best[1])
        ')"
        if [[ -z "$UDID" ]]; then
          echo "::error::Nenhum simulador de iPhone disponível"
          exit 1
        fi
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        xcrun simctl boot "$UDID" || echo "::warning::simctl boot não ligou o simulador agora; o bootstatus -b liga na hora do teste"
